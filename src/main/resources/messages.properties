description.general=<p>You have a dataset that you want to partition into hierarchical clusters \
  using <i>{0}</i> with <b>{1}</b> for merging clusters. {2}</p> \
  <p>Determine the hierarchical clusters and write down the clusters of data points \
  that would be obtained for the respective distance threshold, using the following syntax:</p>\
  <p><b>Distance dd: '{'X,Y,Z'}'</b><br />\
  (dd = the distance/height of the clustering; '{'X,Y,Z'}' = the new cluster)</p>\
  Examples:<br />\
  <i>Distance 1.5: '{'1,2'}' ("merge clusters 1 and 2 at distance 1.5")<br />\
  Distance 2.0: '{'3,4,5,6'}' ("merge clusters 34 and 56 (or 35 and 46, etc.) at distance 2.0")<br />\
  Distance 4.5: '{'7,8'}', '{'9,10'}' ("merge clusters 7 and 8 at distance 4.5 and merge clusters 9 and 10 at distance 4.5")</i>

