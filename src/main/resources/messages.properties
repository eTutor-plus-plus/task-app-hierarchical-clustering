# Default task description
description.general=\
  <p>\
      You have a dataset that you want to partition into hierarchical clusters \
      using <i>{0}</i> with <b>{1}</b> for merging clusters. {2}\
  </p>\
  <p>\
      Determine the hierarchical clusters and write down the clusters of data points \
      that would be obtained for the respective distance threshold, using the following syntax:\
  </p>\
  <p><b>Distance dd: (X,Y,Z)</b></p>\
  Examples:<br />\
  <i>\
      Distance 1.5: (1,2)<br />\
      Distance 2.0: (3,4,5,6)<br />\
      Distance 4.5: (7,8), (9,10)\
  </i>\
  {3}

description.coordinates=Use the <i>{0}</i> distance metric to calculate the distances \
  between the following data points from their coordinates to form a distance matrix \
  (should not be included in your solution). \
  <b>Note:</b> Round the resulting distances to two decimal places without units, if necessary. \
  For example, 43.656 becomes 43.66 and 43.6546 is 43.65.\
  <div align="center">{1}</div>
description.matrix=Use the following distance matrix for your calculations:<div>{0}</div>

description.euclidean=Euclidean
description.manhattan=Manhattan

description.agglomerative=agglomerative clustering
description.single=minimum distance (single linkage)
description.complete=maximum distance (complete linkage)

description.ordering=<p>Order your solution by distances ascending.</p>


