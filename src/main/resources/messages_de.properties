description.general=<p>Gegeben ist ein Datensatz, welchen Sie mithilfe des <i>{0}</i> unter \
  Nutzung der <b>{1}</b> als Methode für die Zusammenführung in hierarchische Gruppen (Cluster) \
  unterteilen wollen. {2}</p> \
  <p>Bestimmen Sie die hierarchischen Cluster und notieren Sie die Cluster an Datenpunkten, \
  welche bei einer bestimmten Distanz geformt werden oder bereits bestehen, mit folgender Syntax:</p>\
  <p><b>Distance dd: '{'X,Y,Z'}'</b><br />\
  (dd = die Distanz/Höhe des Clusterings; '{'X,Y,Z'}' = die geformten Cluster)</p>\
  Beispiele:<br />\
  <i>Distance 1.5: '{'1,2'}' ("führe Punkte 1 und 2 bei Distanz 1.5 zusammen")<br />\
  Distance 2.0: '{'3,4,5,6'}' ("führe Punkte 3,4,5,6 bei Distanz 2.0 zusammen")<br />\
  Distance 4.5: '{'7,8'}', '{'9,10'}' ("führe Punkte 7 and 8 bei Distanz 4.5 zusammen und führe 9 und 10 \
  bei Distanz 4.5 zusammen bzw. übernehme sie von einem vorherigen Clustering, falls nötig")</i>\
  {3}

